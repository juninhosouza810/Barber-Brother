# ==========================================================================
# Render Blueprint — server BarberMan (API + WhatsApp + lembretes)
# ==========================================================================
# Cria um Web Service a partir do Dockerfile em server/.
# A credencial do Firebase NÃO fica aqui: é definida como variável secreta
# (FIREBASE_SERVICE_ACCOUNT) no painel do Render — ver DEPLOY-RENDER.md.
# ==========================================================================
services:
  - type: web
    name: barberman-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free           # troque para "starter" para ficar sempre ligado (24/7)
    branch: main
    healthCheckPath: /api/services
    envVars:
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: NODE_ENV
        value: production
      # Cole o conteúdo do serviceAccountKey.json aqui pelo painel (Secret).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

    # --- Para produção (plano pago), descomente para manter a sessão do
    #     WhatsApp pareada entre reinícios: ---
    # disk:
    #   name: barberman-data
    #   mountPath: /app/data
    #   sizeGB: 1
