# ==========================================================================
# Render Blueprint — server BarberMan (API + WhatsApp + lembretes)
# ==========================================================================
# Cria um Web Service a partir do Dockerfile em server/.
# A credencial do Firebase NÃO fica aqui: é definida como variável secreta
# (FIREBASE_SERVICE_ACCOUNT) no painel do Render — ver DEPLOY-RENDER.md.
# ==========================================================================
services:
  - type: web
    name: barberman-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free           # troque para "starter" para ficar sempre ligado (24/7)
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # E-mail do dono do sistema (super-admin) — gestão de assinaturas.
      - key: SUPER_ADMIN_EMAIL
        value: juninhosouza810@gmail.com
      # Cole o conteúdo do serviceAccountKey.json aqui pelo painel (Secret).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
